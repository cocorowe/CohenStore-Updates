name: Validate CohenStore content

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate catalog and manifest JSON
        run: python tools/validate_feed.py

      - name: Test developer-release merger
        run: python -m unittest discover -s tests -v
