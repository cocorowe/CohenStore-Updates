name: Publish CohenStore 0.5.11
on:
  push:
    branches: [main]
    paths:
      - 'update/staging/0.5.11/**'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install signature verifier
        run: python -m pip install cryptography==46.0.3
      - name: Reconstruct and verify signed package
        shell: python
        run: |
          import gzip,hashlib,json,shutil
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          stage=Path('update/staging/0.5.11')
          parts=sorted(stage.glob('*.gzpart'))
          assert [p.name for p in parts]==[f'{i:03}.gzpart' for i in range(7)]
          old=Path('update/packages/CohenStore-0.5.10-INSTALLER-FIX.pkg').read_bytes()
          assert hashlib.sha256(old).hexdigest()=='fe9beadb5635bf68440954252b9769218ab21ff263628991a35273eb29d6f568'
          # The 003/004 split was captured with a five-byte inclusive range overlap.
          overlaps=[0,0,0,5,0,0]
          delta_stream=b''.join(p.read_bytes()[skip:] for p,skip in zip(parts,overlaps))
          try:
              delta=gzip.decompress(delta_stream)
          except Exception as exc:
              raise RuntimeError("0.5.11 staging archive is corrupt; refusing to publish") from exc
          assert len(delta)==len(old)==6619136
          data=bytes(a^b for a,b in zip(old,delta))
          manifest=json.loads((stage/'release.json').read_text())
          public=Ed25519PublicKey.from_public_bytes(bytes.fromhex('6d7df4c99728545705a58cb75c6e15aa097f03ab452c86726da359668bbfec41'))
          public.verify(bytes.fromhex(manifest['signature']),manifest['signed_payload'].encode())
          release=json.loads(manifest['signed_payload'])
          assert release['version']=='0.5.11' and release['version_code']==61 and release['revision']==6
          assert release['schema']==1 and release['channel']=='testing'
          assert release['title_id']=='CHST00001' and release['content_id']=='IV0000-CHST00001_00-COHENSTORE000000'
          assert release['sha256']==hashlib.sha256(data).hexdigest()=='5e6f59d9a72c2b8f1c4b3f6a1a402105a44dfccca1f3863e84bff77e78a377fa'
          assert release['size_bytes']==len(data)==6619136
          assert data[:4]==b'\x7fCNT'
          assert data[0x40:0x64]==b'IV0000-CHST00001_00-COHENSTORE000000'
          assert release['url']=='https://raw.githubusercontent.com/cocorowe/CohenStore-Updates/main/update/packages/CohenStore-0.5.11-ARCHIVE-TEST.pkg'
          Path('update/packages/CohenStore-0.5.11-ARCHIVE-TEST.pkg').write_bytes(data)
          shutil.copyfile(stage/'release.json','update/release.json')
          shutil.copyfile(stage/'repository-readme.md','README.md')
          shutil.copyfile(stage/'instructions.md','update/README.md')
          shutil.copyfile(stage/'catalog.json','catalog/catalog.json')
          shutil.copyfile(stage/'validate_feed.py','tools/validate_feed.py')
          shutil.copyfile(stage/'check_downloads.py','tools/check_downloads.py')
          shutil.copyfile(stage/'test_download_checks.py','tests/test_download_checks.py')
      - name: Validate Archive catalog and monitoring tools
        run: |
          python3 tools/validate_feed.py
          python3 -m unittest discover -s tests -v
      - name: Publish verified package and signed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/packages/CohenStore-0.5.11-ARCHIVE-TEST.pkg update/release.json README.md update/README.md catalog/catalog.json tools/validate_feed.py tools/check_downloads.py tests/test_download_checks.py
          git rm -r update/staging/0.5.11
          git commit -m "Publish verified CohenStore 0.5.11 package and signed updater feed"
          git pull --rebase origin main
          git push origin HEAD:main
