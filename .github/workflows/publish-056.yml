name: Publish CohenStore 0.5.6
on:
  push:
    branches: [main]
    paths:
      - 'update/staging/0.5.6/**'
permissions:
  contents: write
concurrency:
  group: cohenstore-package-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify package
        shell: python
        run: |
          import gzip, hashlib
          from pathlib import Path
          parts=sorted(Path('update/staging/0.5.6').glob('*.gzpart'))
          assert [p.name for p in parts]==[f'{i:03}.gzpart' for i in range(6)]
          old=Path('update/packages/CohenStore-0.5.5-UPDATER-TEST.pkg').read_bytes()
          assert hashlib.sha256(old).hexdigest()=='4a8b6e80dc1d3f2225c9cda8bcdd6aee380a250c31e335edf49d54172dc31f03'
          delta=gzip.decompress(b''.join(p.read_bytes() for p in parts))
          assert len(delta)==len(old)==6619136
          data=bytes(a^b for a,b in zip(old,delta))
          assert hashlib.sha256(data).hexdigest()=='401068973529e3096fc590574458ec4918eaf54e837f66089d49b69b4eaf8a89'
          assert data[:4]==b'\x7fCNT'
          assert data[0x40:0x64]==b'IV0000-CHST00001_00-COHENSTORE000000'
          Path('update/packages/CohenStore-0.5.6-UPDATER-TEST.pkg').write_bytes(data)
      - name: Publish verified package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/packages/CohenStore-0.5.6-UPDATER-TEST.pkg
          git rm -r update/staging/0.5.6
          git commit -m "Publish verified CohenStore 0.5.6 updater test package"
          git push origin HEAD:main
  game-download:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build desktop download engine
        run: |
          unzip -q update/sources/CohenStore-0.5.6-Source.zip -d /tmp/cohen-source
          make -C /tmp/cohen-source/CohenStore all
      - name: Download complete 2048 package and verify publisher SHA-256
        timeout-minutes: 5
        run: |
          /tmp/cohen-source/CohenStore/build/cohen-store download catalog/catalog.json skidgfx/PS4-2048/321177781 /tmp/cohen-game-test 1 1000 > /tmp/cohen-game-result.json
          cat /tmp/cohen-game-result.json
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          r=json.loads(Path('/tmp/cohen-game-result.json').read_text())
          assert r['ok'] and r['bytes']==35454976
          assert hashlib.sha256(Path(r['path']).read_bytes()).hexdigest()=='c53d517bb4ff86c62638edf03548bc94c9bd4b2b21c618c69770469a809c2e4a'
          print('Full 2048 download matches publisher SHA-256. PS4 transport still requires console testing.')
          PY
