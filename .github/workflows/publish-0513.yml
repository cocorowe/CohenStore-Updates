name: Publish CohenStore 0.5.13
on:
  push:
    branches: [main]
    paths:
      - 'update/staging/0.5.13/**'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package verification dependencies
        run: python -m pip install cryptography==46.0.3 bsdiff4==1.2.6
      - name: Reconstruct and verify the new signed package
        shell: python
        run: |
          import bsdiff4,hashlib,json,shutil
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          stage=Path('update/staging/0.5.13')
          old=Path('update/packages/CohenStore-0.5.12-UPDATE-TEST.pkg').read_bytes()
          assert hashlib.sha256(old).hexdigest()=='7bbb6d73dd2d1d923e211ba943c9435fca0a71c0fd458eeac63f7c209d3f3162'
          expected_parts={'000.bsdiffpart': '8f3ce72a00e8ce536bda61f2c3b2cff665868be6e53783419036ab3f0ad93062', '001.bsdiffpart': '746ed01f407987a2bef54446cc53b1a329363bf7c313cfbed44c54c72776c0bc', '002.bsdiffpart': 'd40a7ede894f6be4464b2ce07b050ce47ce350d20c7d271ea516b89a796778ba', '003.bsdiffpart': '1049ff2080b5efbef16ece6e624bd4e6338ca6c49edcfd4dbd23073627202271', '004.bsdiffpart': '2611d06b9fd14666a8a7ec57ea1e956617b61947081b976d01eeb0a4093dd600', '005.bsdiffpart': '2fe22e33270e3b51569fa50ba76448378f8a1d57e9525838461a27cd51fb9391'}
          parts=sorted(stage.glob('*.bsdiffpart'))
          assert [p.name for p in parts]==list(expected_parts)
          for part in parts:
              assert hashlib.sha256(part.read_bytes()).hexdigest()==expected_parts[part.name], part.name
          patch=b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(patch).hexdigest()=='6778884cc58b358af91ff9ea42ac074ffc129e89f33f907bd429c8f3e7bc6c20'
          data=bsdiff4.patch(old,patch)
          assert len(data)==6619136
          assert hashlib.sha256(data).hexdigest()=='0f2883be2555351adec55300c313b95e9ce9ce1535ed5b95580a503982cec93e'
          manifest=json.loads((stage/'release.json').read_text())
          Ed25519PublicKey.from_public_bytes(bytes.fromhex('6d7df4c99728545705a58cb75c6e15aa097f03ab452c86726da359668bbfec41')).verify(bytes.fromhex(manifest['signature']),manifest['signed_payload'].encode())
          release=json.loads(manifest['signed_payload'])
          assert release['version']=='0.5.13' and release['version_code']==513 and release['revision']==8
          assert release['schema']==1 and release['channel']=='testing'
          assert release['sha256']==hashlib.sha256(data).hexdigest() and release['size_bytes']==len(data)
          assert release['title_id']=='CHST00001' and release['content_id']=='IV0000-CHST00001_00-COHENSTORE000000'
          assert data[:4]==b'\x7fCNT' and data[0x40:0x64]==b'IV0000-CHST00001_00-COHENSTORE000000'
          assert release['url']=='https://raw.githubusercontent.com/cocorowe/CohenStore-Updates/main/update/packages/CohenStore-0.5.13-STAGING-FIX.pkg'
          Path('update/packages/CohenStore-0.5.13-STAGING-FIX.pkg').write_bytes(data)
          shutil.copyfile(stage/'release.json','update/release.json')
          shutil.copyfile(stage/'instructions.md','update/README.md')
          shutil.copyfile(stage/'repository-readme.md','README.md')
      - name: Validate catalog and repository tests
        run: |
          python3 tools/validate_feed.py
          python3 -m unittest discover -s tests -v
      - name: Publish verified update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/packages/CohenStore-0.5.13-STAGING-FIX.pkg update/release.json update/README.md README.md
          git rm -r update/staging/0.5.13
          git commit -m "Publish verified CohenStore 0.5.13 for installed 0.5.11 builds"
          git pull --rebase origin main
          git push origin HEAD:main
