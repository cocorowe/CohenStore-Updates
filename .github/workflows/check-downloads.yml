name: Check catalog download links
on:
  push:
    paths:
      - 'catalog/catalog.json'
      - 'tools/check_downloads.py'
      - 'tests/test_download_checks.py'
      - '.github/workflows/check-downloads.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * *'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate_feed.py
      - run: python tools/check_downloads.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-link-check
          path: reports/download-check.json
          retention-days: 14
