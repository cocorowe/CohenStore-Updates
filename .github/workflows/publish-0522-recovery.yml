name: Publish verified CohenStore 0.5.22 recovery feed
on:
  push:
    branches: [main]
    paths:
      - 'update/staging/0.5.22/*.part'
permissions:
  contents: write
concurrency:
  group: cohenstore-package-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify signatures and assemble exact native package
        run: |
          python3 -m pip install cryptography==46.0.3
          python3 tools/publish_0522_recovery.py
      - name: Run current catalog validation
        run: python3 tools/validate_feed.py
      - name: Publish separate signed recovery feed without touching old feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/packages/CohenStore-0.5.22-SIGNED-UPDATE-TEST.pkg update/recovery/release.json update/recovery/manifest.json
          git rm -r update/staging/0.5.22
          git commit -m "Publish verified CohenStore 0.5.22 signed recovery channel"
          git fetch origin main
          python3 - <<'PY'
          import json, subprocess
          previous=json.loads(subprocess.check_output(["git","show","origin/main:update/release.json"]))
          payload=json.loads(previous["signed_payload"])
          assert (payload["version_code"],payload["revision"]) == (517,12), "Legacy feed has changed"
          assert subprocess.run(["git","cat-file","-e","origin/main:update/recovery/release.json"],capture_output=True).returncode != 0, "Recovery feed already exists"
          PY
          git push origin HEAD:main
