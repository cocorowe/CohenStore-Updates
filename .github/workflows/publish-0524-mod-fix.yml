name: Publish CohenStore 0.5.24 signed mod-menu TEST via recovery channel
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'update/staging/0.5.24/import-request.txt'
permissions:
  contents: write
concurrency:
  group: cohenstore-package-publication
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned verification and transfer dependencies
        run: python3 -m pip install cryptography==46.0.3 gdown==5.2.0
      - name: Fetch staging PKG from Drive and verify exact bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m gdown --id 1XixUw1zUsSQvXEeiUeZTij-tmRRnaYpe -O /tmp/cohenstore-0524-verified.pkg
          test "$(stat -c %s /tmp/cohenstore-0524-verified.pkg)" -eq 46006272
          echo 'ce4148dccf36f9429f6685a400ae45f32e04184b335fac1fa7602ebcae11f107  /tmp/cohenstore-0524-verified.pkg' | sha256sum -c -
      - name: Verify signed revision, old feeds, catalogs, and package identity
        run: |
          python3 tools/publish_0524_mod_fix.py
          python3 tools/validate_feed.py
      - name: Commit package and signed recovery update only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/packages/CohenStore-0.5.24-Mod-Menu-Fix-PS4-TEST.pkg \
                  update/recovery/release.json update/recovery/manifest.json \
                  update/recovery/history/0.5.22-release.json update/recovery/history/0.5.22-manifest.json
          git commit -m "Publish signed CohenStore 0.5.24 mod-menu testing update with recovery rollback history"
          git fetch origin main
          python3 - <<'PY'
          import json, subprocess
          def remote(path):
              return json.loads(subprocess.check_output(['git','show','origin/main:'+path]))
          old=remote('update/release.json')
          recovery=remote('update/recovery/release.json')
          legacy=json.loads(old['signed_payload'])
          installed=json.loads(recovery['signed_payload'])
          assert (legacy['version_code'],legacy['revision'])==(517,12), 'legacy feed changed; stop'
          assert (installed['version_code'],installed['revision'])==(522,13), 'recovery feed changed; stop'
          PY
          git push origin HEAD:main
