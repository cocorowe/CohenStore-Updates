name: Catalog preservation guard
on:
  pull_request:
    paths:
      - 'catalog/**'
      - 'tools/catalog_preservation_guard.py'
      - '.github/workflows/catalog-preservation.yml'
  workflow_dispatch:
jobs:
  catalog-preservation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify catalog entry floors
        run: python tools/catalog_preservation_guard.py
